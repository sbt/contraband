name: CI
on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - jobtype: 1
          - jobtype: 2
          - jobtype: 3
          - jobtype: 4
    steps:
    - uses: actions/checkout@v6
    - name: Setup JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 11
        cache: sbt
    - uses: sbt/setup-sbt@v1
    - if: ${{ matrix.jobtype == 1 }}
      shell: bash
      run: sbt -v "++2.13.x" library/test
    - if: ${{ matrix.jobtype == 2 }}
      shell: bash
      run: sbt -v "++2.12.x" test scripted
    - if: ${{ matrix.jobtype == 3 }}
      shell: bash
      run: sbt -v "++3.x" test scripted
    - if: ${{ matrix.jobtype == 4 }}
      shell: bash
      run: sbt -v "++2.12.x" scalafmtSbtCheck scalafmtCheckAll
  push_gh_pages:
    needs: test
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v5
      with:
        java-version: 8
        distribution: adopt
    - uses: actions/checkout@v6
    - uses: sbt/setup-sbt@v1
    - run: sbt makeSite
    - name: Push to gh-pages
      if: ${{ github.repository_owner == 'sbt' && github.ref == 'refs/heads/develop' && github.event_name == 'push' }}
      uses: JamesIves/github-pages-deploy-action@4a3abc783e1a24aeb44c16e869ad83caf6b4cc23 # v4.7.4
      with:
        branch: gh-pages
        folder: target/site
